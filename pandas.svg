<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 200" width="420" height="200" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dos pandas kawaii con un corazón</title>
  <defs>
    <g id="panda">
      <circle cx="-54" cy="-56" r="24" fill="#4A4A4A"/>
      <circle cx="54" cy="-56" r="24" fill="#4A4A4A"/>
      <circle cx="-54" cy="-56" r="10" fill="#FFB7D5"/>
      <circle cx="54" cy="-56" r="10" fill="#FFB7D5"/>
      <ellipse cx="0" cy="0" rx="70" ry="60" fill="#FFFFFF" stroke="#FFD1E3" stroke-width="2"/>
      <ellipse cx="-34" cy="-2" rx="14" ry="19" transform="rotate(25 -34 -2)" fill="#4A4A4A"/>
      <ellipse cx="34" cy="-2" rx="14" ry="19" transform="rotate(-25 34 -2)" fill="#4A4A4A"/>
      <circle cx="-35.5" cy="-5.5" r="4" fill="#FFFFFF"/>
      <circle cx="32.5" cy="-5.5" r="4" fill="#FFFFFF"/>
      <circle cx="-31" cy="2" r="1.8" fill="#FFFFFF"/>
      <circle cx="37" cy="2" r="1.8" fill="#FFFFFF"/>
      <ellipse cx="-40" cy="26" rx="9" ry="5.5" fill="#FF9EC4" opacity=".6"/>
      <ellipse cx="40" cy="26" rx="9" ry="5.5" fill="#FF9EC4" opacity=".6"/>
      <path d="M-7 6 Q0 2 7 6 Q5 15 0 16 Q-5 15 -7 6 Z" fill="#4A4A4A"/>
      <path d="M0 16 L0 20 M-9 20 Q-4.5 26 0 20 Q4.5 26 9 20" fill="none" stroke="#4A4A4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path id="heart" d="M0 7 C-12 -3 -9 -14 0 -8 C9 -14 12 -3 0 7 Z"/>
    <path id="spark" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
  </defs>

  <!-- fondo -->
  <rect x="3" y="3" width="414" height="194" rx="46" fill="#FFE4EE" stroke="#FFB7D5" stroke-width="4"/>

  <!-- decoraciones -->
  <use xlink:href="#heart" transform="translate(210 100) scale(2.4)" fill="#FF9EC4"/>
  <use xlink:href="#spark" transform="translate(210 40)" fill="#FFB7D5"/>
  <use xlink:href="#heart" transform="translate(190 146) scale(.8)" fill="#FFB7D5"/>
  <use xlink:href="#spark" transform="translate(230 146) scale(.7)" fill="#FF9EC4"/>
  <use xlink:href="#heart" transform="translate(24 172) scale(.8)" fill="#FF9EC4" opacity=".7"/>
  <use xlink:href="#spark" transform="translate(396 172) scale(.8)" fill="#FFB7D5"/>

  <!-- pandas -->
  <use xlink:href="#panda" transform="translate(100 108)"/>
  <use xlink:href="#panda" transform="translate(320 108)"/>

  <!-- moño del panda izquierdo -->
  <path d="M160 32 L146 23 Q142 32 146 41 Z" fill="#FF8FB8"/>
  <path d="M160 32 L174 23 Q178 32 174 41 Z" fill="#FF8FB8"/>
  <circle cx="160" cy="32" r="4.5" fill="#FF6FA5"/>

  <!-- florcita del panda derecho -->
  <g fill="#FFB7D5">
    <circle cx="266" cy="32" r="4.5"/>
    <circle cx="261.9" cy="37.7" r="4.5"/>
    <circle cx="255.2" cy="35.5" r="4.5"/>
    <circle cx="255.2" cy="28.5" r="4.5"/>
    <circle cx="261.9" cy="26.3" r="4.5"/>
  </g>
  <circle cx="260" cy="32" r="3.2" fill="#FFF1B8"/>
</svg>
